# Forest Focus — web deployment (Docker Compose)
#
# Works in two ways:
#   1. Portainer → Stacks → Git repository
#        * Repository:    https://github.com/BeomD/forest-productivity
#        * Compose path:  docker-compose.yml
#      Portainer clones the repo and builds the image from it.
#   2. Local host at /opt/Forest
#        cd /opt/Forest && docker compose up -d --build
#
# The container serves the static site on port 80, published on host 6666.
# HTTPS / the public domain is terminated by Nginx Proxy Manager (NPM Plus),
# which reverse-proxies to http://<host>:6666.

services:
  forest-web:
    build:
      # Relative to the compose file / repo root (Portainer clones the repo here).
      context: .
      dockerfile: Dockerfile
    image: forest-web:latest
    container_name: forest-web

    # Host 6666 -> container 80 (NPM Plus proxies to this).
    ports:
      - "6666:80"

    environment:
      - TZ=Asia/Seoul

    restart: unless-stopped

    # Simple container health check against the nginx endpoint.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
