# nginx configuration for the Forest Focus static web build.
#
# The Expo Router static export writes one HTML file per route
# (e.g. /forest -> forest.html), so direct deep links and refreshes
# are resolved with `try_files` before falling back to the SPA shell.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Compression ────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Hashed Metro/Expo bundles: cache forever ───────────────────────
    location /_expo/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── Static assets: cache for 30 days ───────────────────────────────
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ── The HTML shell must never be cached ────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── Routes ─────────────────────────────────────────────────────────
    #  /forest    -> forest.html
    #  /foo/      -> foo/index.html
    #  fallback   -> /index.html (client-side router handles the rest)
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # ── Lightweight container health check ─────────────────────────────
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
